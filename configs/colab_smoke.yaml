# Trening testowy w Google Colab: sprawdza, czy trening działa w Colabie i czy wznawia się
# po restarcie sesji. NIE służy do raportowania wyników.
# Uruchamiany z notebooks/colab_train.ipynb.

run_name: colab_smoke
seed: 42

# Archiwum z Zenodo na lokalnym dysku Colaba (szybki odczyt; notebook je pobiera lub kopiuje);
# wyniki na Dysku Google (przetrwają rozłączenie sesji).
data_zip: /content/data/gwhd_2021.zip
output_dir: /content/drive/MyDrive/counting-crops/outputs

# Mapy gęstości
sigma: 10.0
downsample: 8
density_scale: 100.0

# Dane
crop_size: 256
n_train: 32
n_val: 16
eval_train: true

# Trening
epochs: 10
eval_every: 5
batch_size: 4
lr: 1.0e-5
weight_decay: 0.0
num_workers: 2       # Colab (Linux) obsługuje procesy robocze bez kopiowania danych
