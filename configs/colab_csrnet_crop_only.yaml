# Pełny trening CSRNet w Google Colab (T4), profil augmentacji: crop_only.
# Para konfiguracji colab_csrnet_crop_only / colab_csrnet_thesis_aug różni się WYŁĄCZNIE
# polami run_name i augmentation - profil wybieramy na podstawie val MAE (nie testu).
# Wartości epochs / eval_every / batch_size / lr to punkt startowy, nie wynik strojenia.
# Szacunek na T4: ok. 5-6 min na epokę treningu + ok. 7 min na walidację (1476 pełnych
# obrazów), czyli ok. 9 h łącznie - wymaga kilku wznowień po rozłączeniu sesji.
# Uruchamiany z notebooks/colab_train.ipynb (CONFIG = "configs/colab_csrnet_crop_only.yaml").

run_name: csrnet_crop_only
seed: 42

data_zip: /content/data/gwhd_2021.zip
output_dir: /content/drive/MyDrive/counting-crops/outputs

# Mapy gęstości
sigma: 10.0          # [px] hipoteza; ewentualna zmiana tylko na podstawie walidacji
downsample: 8
density_scale: 100.0

# Dane
crop_size: 256
augmentation: crop_only  # crop_only | thesis_aug (src/dataset.py: AUGMENTATION_PROFILES); tylko train
n_train: null        # wszystkie 3657 obrazów uczących
n_val: null          # wszystkie 1476 obrazów walidacyjnych
eval_train: false    # MAE na 3657 pełnych obrazach uczących trwałoby dłużej niż walidacja

# Trening
epochs: 60
eval_every: 2
batch_size: 4
lr: 1.0e-5
weight_decay: 0.0
num_workers: 2
